# Builds the signed .aab file to upload to Google Play Console. Run from the Actions tab.
name: Play Store release (AAB)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm install && npm run build:www
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0f4535' --splashBackgroundColor '#0f4535'
      - run: cp android-config/google-services.json android/app/google-services.json
      - run: npx cap sync android
      - name: Version
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: cd android && ./gradlew bundleRelease --no-daemon
      - name: Sign
        env: {KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", PW: "${{ secrets.KEYSTORE_PASSWORD }}"}
        run: |
          echo "$KS" | base64 -d > ks.jks
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore ks.jks -storepass "$PW" "$AAB" deensay
          mkdir out && cp "$AAB" out/deen-say-1.0.${{ github.run_number }}.aab && rm ks.jks
      - uses: actions/upload-artifact@v4
        with: {name: deen-say-play-aab, path: out/}
