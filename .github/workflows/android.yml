# Builds an installable Android APK on every push to main (and on demand from the Actions tab).
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build:www
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0f4535' --splashBackgroundColor '#0f4535'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: deen-diary-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
