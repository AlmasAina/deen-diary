# Run ONCE from the Actions tab: creates the Play Store upload key, locked with your KEYSTORE_PASSWORD secret.
# Download the artifact, keep deensay-upload.jks safe forever, and paste keystore-base64.txt into the ANDROID_KEYSTORE_BASE64 secret.
name: Play upload key (run once)
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - env: {PW: "${{ secrets.KEYSTORE_PASSWORD }}"}
        run: |
          if [ ${#PW} -lt 8 ]; then echo "Set the KEYSTORE_PASSWORD secret first (8+ characters)"; exit 1; fi
          mkdir out && keytool -genkeypair -v -keystore out/deensay-upload.jks -alias deensay -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Deen Say, O=Deen Say, C=PK"
          base64 -w0 out/deensay-upload.jks > out/keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with: {name: deensay-upload-key, path: out/, retention-days: 1}
